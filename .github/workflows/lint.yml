name: lint

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check every script
        run: |
          for f in install.sh uninstall.sh bin/*; do
            [ -f "$f" ] || continue
            bash -n "$f" && echo "ok   $f"
          done

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          additional_files: 'bin/devstack bin/site-cert-regen'
          severity: warning

      - name: Templates have no unreplaced placeholders after rendering
        run: |
          fail=0
          for t in config/*.template; do
            out=$(sed -e 's|{{BREW}}|/opt/homebrew|g' -e 's|{{SITES}}|/home/u/sites|g' \
                      -e 's|{{TLD}}|test|g'  -e 's|{{USER}}|u|g' \
                      -e 's|{{GROUP}}|staff|g' -e 's|{{PHPSHORT}}|83|g' \
                      -e 's|{{SECRET}}|x|g' "$t")
            if printf '%s' "$out" | grep -q '{{'; then
              echo "unreplaced placeholder in $t:"
              printf '%s' "$out" | grep -n '{{' | sed 's/^/    /'
              fail=1
            else
              echo "ok   $t"
            fi
          done
          exit $fail

      - name: No variable may touch a multibyte character unbraced
        run: |
          # `echo "$var…"` is parsed by macOS's stock bash 3.2 as the variable
          # "var<bytes>", which is unbound — the script dies on a fresh Mac and
          # nowhere else. This class has been reintroduced twice; now it is a gate.
          if grep -rnP '\$[A-Za-z_][A-Za-z0-9_]*[^\x00-\x7F]' install.sh uninstall.sh bin/devstack bin/site-cert-regen; then
            echo "FAIL: brace these as \${var} — stock bash 3.2 eats the multibyte char into the name"
            exit 1
          fi
          echo "ok: no unbraced variables against multibyte characters"

      - name: --help must not leak script body
        run: |
          out=$(bash install.sh --help)
          # Signatures that only appear in the script body, never in help text.
          # (Plain "SITES_DIR=" is not one — the help shows it as an example.)
          if printf '%s' "$out" | grep -qE '^(set -euo pipefail|#!/usr/bin/env|[A-Z_]+="\$\{[A-Z_]+:-)'; then
            echo "--help printed script code:"; printf '%s\n' "$out"; exit 1
          fi
          printf '%s' "$out" | grep -q 'Usage:' || { echo "--help missing Usage"; exit 1; }
          echo "ok   --help"
