name: fresh-install

# A real first-run test: a clean macOS machine, nothing configured.
# Expensive and slow, so it runs on pull requests and on demand, not every push.
on:
  pull_request:
  workflow_dispatch:

jobs:
  install:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      TLD: devtest
      PHP_VERSION: '8.3'

    steps:
      - uses: actions/checkout@v4

      # The runner context is not available in workflow- or job-level env —
      # referencing it there makes the whole workflow file invalid, and GitHub
      # reports only "workflow file issue". Export at runtime instead.
      - name: Set SITES_DIR
        run: echo "SITES_DIR=$RUNNER_TEMP/sites" >> "$GITHUB_ENV"

      - name: Show the starting state
        run: |
          echo "brew: $(brew --version | head -1)"
          echo "prefix: $(brew --prefix)"
          for f in nginx dnsmasq mkcert php@8.3 mysql wp-cli composer; do
            printf '%-12s %s\n' "$f" "$(brew list --versions "$f" 2>/dev/null || echo 'NOT INSTALLED')"
          done

      - name: Dry run must change nothing
        run: |
          ./install.sh --dry-run
          test ! -d "$SITES_DIR" && echo "ok: dry run created no sites dir" || {
            echo "FAIL: dry run created $SITES_DIR"; exit 1; }

      - name: Install
        run: ./install.sh

      - name: Trust the local CA
        run: mkcert -install

      - name: Resolver for .$TLD
        run: |
          sudo mkdir -p /etc/resolver
          echo "nameserver 127.0.0.1" | sudo tee "/etc/resolver/$TLD" >/dev/null
          sudo killall -HUP mDNSResponder || true

      - name: Start services
        run: |
          brew services start "php@$PHP_VERSION"
          brew services start mysql
          sudo brew services start dnsmasq
          sudo brew services start nginx
          # MySQL reports "started" before it accepts connections.
          for i in $(seq 1 60); do mysql -uroot -e 'SELECT 1' >/dev/null 2>&1 && break; sleep 2; done
          mysql -uroot -e 'SELECT VERSION()'

      - name: Doctor
        run: bin/devstack doctor

      - name: Configure and create one site of each type
        run: |
          printf 'CI User\nci@example.com\nciadmin\n' | bin/devstack config
          bin/devstack config --show
          bin/devstack new wp-site
          bin/devstack new plain-site --type=plain
          sudo nginx -s reload

      - name: The sites must actually serve
        run: |
          fail=0
          for s in wp-site plain-site; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "http://$s.$TLD/" || echo 000)
            echo "$s -> $code"
            [ "$code" = "200" ] || fail=1
          done
          # HTTPS proves the certificate is trusted and covers the name.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://wp-site.$TLD/" || echo 000)
          echo "https wp-site -> $code"
          [ "$code" = "200" ] || fail=1
          curl -sS --max-time 30 "http://wp-site.$TLD/" | grep -qi 'wp-content' \
            && echo "ok: WordPress served" || { echo "FAIL: not WordPress"; fail=1; }
          exit $fail

      - name: list and rm
        run: |
          bin/devstack list
          printf 'plain-site\n' | bin/devstack rm plain-site
          bin/devstack list | grep -q 'plain-site' && { echo "FAIL: still listed"; exit 1; } || echo "ok: removed"

      - name: PostgreSQL-backed site, end to end
        run: |
          bin/devstack install postgres
          bin/devstack new pg-site --type=plain --db=pgsql
          psql -h 127.0.0.1 -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='dev_pg_site'" | grep -q 1 \
            && echo "ok: database in postgres" || { echo "FAIL: no pg database"; exit 1; }
          bin/devstack creds pg-site | grep -q 'pgsql' && echo "ok: creds report pgsql"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -H "Host: pg-site.$TLD" http://127.0.0.1/)
          [ "$code" = "200" ] && echo "ok: serves ($code)" || { echo "FAIL: $code"; exit 1; }
          printf 'pg-site\n' | bin/devstack rm pg-site
          psql -h 127.0.0.1 -d postgres -tAc "SELECT count(*) FROM pg_database WHERE datname='dev_pg_site'" | grep -q '^0$' \
            && echo "ok: rm dropped the pg database" || { echo "FAIL: pg database survived rm"; exit 1; }

      - name: MCP server smoke test
        run: |
          { printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}'
            printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            printf '%s\n' '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list_sites","arguments":{}}}'
            printf '%s\n' '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"stack_status","arguments":{}}}'
          } | bin/devstack-mcp > /tmp/mcp.jsonl
          echo "--- raw responses (first 300 bytes each) ---"
          n=0; while IFS= read -r l; do n=$((n+1)); printf '%d: %.300s\n' "$n" "$l"; done < /tmp/mcp.jsonl
          python3 - <<'PYEOF'
          import json
          lines = [json.loads(l) for l in open('/tmp/mcp.jsonl')]
          by_id = {d['id']: d for d in lines}
          assert by_id[1]['result']['serverInfo']['name'] == 'devstack'
          tools = [t['name'] for t in by_id[2]['result']['tools']]
          assert len(tools) == 8, tools
          assert 'delete_site' not in tools and 'rm' not in tools, "destructive tool exposed!"
          sites = json.loads(by_id[3]['result']['content'][0]['text'])
          assert any(s['name'] == 'wp-site' for s in sites), sites
          checks = json.loads(by_id[4]['result']['content'][0]['text'])
          assert all(c['status'] in ('pass','warn','fail') for c in checks)
          print(f"ok: MCP — {len(tools)} tools, {len(sites)} sites, {len(checks)} checks, no destructive tools")
          PYEOF

      - name: Uninstall must reverse everything
        run: |
          printf 'y\n' | ./uninstall.sh
          fail=0
          for f in "$(brew --prefix)/bin/devstack" \
                   "$(brew --prefix)/etc/nginx/servers/local-dev.conf" \
                   "$(brew --prefix)/etc/nginx/php-versions.map" \
                   "/etc/resolver/$TLD"; do
            [ -e "$f" ] && { echo "FAIL: left behind: $f"; fail=1; }
          done
          grep -rl 'mailpit sendmail' "$(brew --prefix)"/etc/php/*/conf.d/ 2>/dev/null \
            && { echo "FAIL: mail still routed to a removed mailpit"; fail=1; }
          grep -q '/usr/bin/true' "$(brew --prefix)"/etc/php/*/conf.d/zz-mailpit.ini \
            && echo "ok: mail() discards rather than delivering after uninstall"
          [ "$fail" = 0 ] && echo "ok: uninstall left nothing behind"
          exit $fail

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "--- brew services ---"; brew services list || true
          echo "--- listeners ---";     sudo lsof -nP -iTCP:80 -iTCP:443 -sTCP:LISTEN || true
          echo "--- nginx error ---";   tail -50 "$(brew --prefix)/var/log/nginx/${TLD}-error.log" || true
          echo "--- php-fpm ---";       tail -30 "$(brew --prefix)/var/log/php-fpm-${PHP_VERSION}.log" || true
          echo "--- resolver ---";      cat "/etc/resolver/$TLD" || true
          echo "--- dig ---";           dig +short "@127.0.0.1" "wp-site.$TLD" || true
